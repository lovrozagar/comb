# bun test runs tests/bun, the suites vitest cannot load (bun:sqlite, bun:test). Its coverage
# gates the one file only Bun can run, drivers/bun-sqlite.ts, at 100%; vitest measures the
# rest, so everything else these suites happen to load is left out here.
[test]
# every run is in UTC, as CI's runners are (tests/bun/support/utc.ts)
preload = ["./tests/bun/support/utc.ts"]
coverage = true
coverageSkipTestFiles = true
coverageThreshold = { lines = 1.0, functions = 1.0 }
coveragePathIgnorePatterns = [
	"tests/**",
	"src/*.ts",
	"src/codegen/**",
	"src/meta/**",
	"src/pg/**",
	"src/query/**",
	"src/sqlite/**",
	"src/migrate/core/**",
	"src/migrate/drivers/memory.ts",
	"src/migrate/drivers/sqlite.ts",
	"src/migrate/drivers/d1.ts",
	"src/migrate/drivers/postgres.ts",
	"src/migrate/drivers/index.ts",
]
