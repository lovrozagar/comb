name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.11"

jobs:
  commitlint:
    name: commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Lint commit messages
        run: |
          bunx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

  check:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run fmt:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run typecheck:strict
      # the release's publish path on every push, with the release's npm, so it is red on main before a tag ever runs it
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install -g npm@latest
      - name: dry-run the release publish
        run: |
          packed="$(.github/scripts/pack-for-publish.sh packages/core)"
          # npm refuses even a dry run of a version it has, so the candidate goes as a prerelease no one installs
          (cd "$packed" && npm pkg set version="$(npm pkg get version | tr -d '"')-dry-run")
          npm publish "$packed" --dry-run --ignore-scripts --tag dry-run

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: comb
          POSTGRES_PASSWORD: comb
          POSTGRES_USER: comb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U comb -d comb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # The Postgres suites are required here; tests/integration/support/pg.ts fails the run when it is unset.
      COMB_TEST_PG_URL: postgres://comb:comb@localhost:5432/comb?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # vitest runs on Node; Miniflare's workerd and the pg drivers are exercised there
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      # The Atlas suites are required here; tests/integration/support/atlas.ts fails the run without it.
      - name: install atlas v1.3.0
        run: |
          mkdir -p "$RUNNER_TEMP/atlas"
          curl -sSfL -o "$RUNNER_TEMP/atlas/atlas" https://release.ariga.io/atlas/atlas-linux-amd64-v1.3.0
          echo "cfc773e5b4e845bc01d680390c174648938a7f88bf30e5a2c83ae85217c21587  $RUNNER_TEMP/atlas/atlas" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/atlas/atlas"
          echo "$RUNNER_TEMP/atlas" >> "$GITHUB_PATH"
      - run: bun run test:coverage
      - run: bun run test:bun

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: comb
          POSTGRES_PASSWORD: comb
          POSTGRES_USER: comb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U comb -d comb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # postgres.e2e.test.ts is required here: tests/integration/support/pg.ts fails the run when it is unset.
      COMB_TEST_PG_URL: postgres://comb:comb@localhost:5432/comb?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # vitest runs on Node; the apps run the comb binary under bun, as users do
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      # migrate diff runs the real Atlas
      - name: install atlas v1.3.0
        run: |
          mkdir -p "$RUNNER_TEMP/atlas"
          curl -sSfL -o "$RUNNER_TEMP/atlas/atlas" https://release.ariga.io/atlas/atlas-linux-amd64-v1.3.0
          echo "cfc773e5b4e845bc01d680390c174648938a7f88bf30e5a2c83ae85217c21587  $RUNNER_TEMP/atlas/atlas" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/atlas/atlas"
          echo "$RUNNER_TEMP/atlas" >> "$GITHUB_PATH"
      - run: bun run --filter @lovrozagar/comb test:e2e

  consumers:
    name: consumers (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # the oldest Node that type-strips (tsx needs no flag there either) and the current one
        node: ["22.12", "24"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun run --filter @lovrozagar/comb test:consumers
