name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.11"

jobs:
  commitlint:
    name: commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Lint commit messages
        run: |
          bunx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

  check:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run fmt:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run typecheck:strict

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: comb
          POSTGRES_PASSWORD: comb
          POSTGRES_USER: comb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U comb -d comb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # The Postgres suites are required here; tests/integration/support/pg.ts fails the run when it is unset.
      COMB_TEST_PG_URL: postgres://comb:comb@localhost:5432/comb
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # vitest runs on Node; Miniflare's workerd and the pg drivers are exercised there
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun run test:coverage
      - run: bun run test:bun
