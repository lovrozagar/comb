name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.1.1). Empty = this ref."
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  packages: write

env:
  BUN_VERSION: "1.3.11"
  PACKAGE_NAME: "@lovrozagar/comb"
  PACKAGE_DIR: packages/core

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run fmt:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run typecheck:strict
      - run: bun run test:coverage
      - run: bun run test:bun

  npmjs:
    name: npmjs.com
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install -g npm@latest
      - name: Check tag matches package.json
        run: |
          ref="${{ inputs.tag || github.ref_name }}"
          tag="${ref#v}"
          pkg="$(node -p "require('./${{ env.PACKAGE_DIR }}/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match ${{ env.PACKAGE_DIR }}/package.json version $pkg"
            exit 1
          fi
      - name: Publish to registry.npmjs.org
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          set -euo pipefail
          ref="${{ inputs.tag || github.ref_name }}"
          tag="${ref#v}"
          name="${{ env.PACKAGE_NAME }}"
          encoded="$(node -p 'encodeURIComponent(process.argv[1])' "$name")"

          if npm view "${name}@${tag}" version >/dev/null 2>&1; then
            echo "npm already has ${name}@${tag} — skipping"
            exit 0
          fi
          if curl -fsSIL "https://registry.npmjs.org/${name}/-/${name##*/}-${tag}.tgz" >/dev/null 2>&1; then
            echo "npm tarball for ${name}@${tag} already exists — skipping"
            exit 0
          fi

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "OIDC request URL/token missing — id-token: write is not in effect"
            exit 1
          fi
          audience="$(node -p 'encodeURIComponent("npm:registry.npmjs.org")')"
          curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience}" \
            -o /tmp/oidc.json
          node -e 'const j=require("/tmp/oidc.json"); if(!j.value) process.exit(2)'
          node -e '
            const t = require("/tmp/oidc.json").value
            const p = JSON.parse(Buffer.from(t.split(".")[1], "base64url").toString())
            console.log(JSON.stringify({
              iss: p.iss,
              aud: p.aud,
              sub: p.sub,
              workflow: p.workflow,
              job_workflow_ref: p.job_workflow_ref,
              repository: p.repository,
              ref: p.ref,
              environment: p.environment ?? null,
            }))
          '

          oidc_jwt="$(node -e 'process.stdout.write(require("/tmp/oidc.json").value)')"
          code=$(curl -sS -o /tmp/npm-ex.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${oidc_jwt}" \
            -H "Content-Type: application/json" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${encoded}")
          echo "oidc exchange HTTP $code"
          node -e 'const j=require("/tmp/npm-ex.json"); console.log(JSON.stringify({error:j.error,message:j.message,token_type:j.token_type,expires:j.expires}))'
          if [ "$code" != "201" ]; then
            echo "npm rejected the GitHub OIDC token."
            echo "On https://www.npmjs.com/package/${name} → Settings → Trusted Publisher"
            echo "the saved connection must be exactly:"
            echo "  GitHub Actions / lovrozagar / comb / release.yml / environment empty / allow npm publish"
            exit 1
          fi
          NODE_AUTH_TOKEN="$(node -e 'process.stdout.write(require("/tmp/npm-ex.json").token || "")')"
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "exchange succeeded but returned no token"
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "${HOME}/.npmrc"
          set +e
          npm publish --access public --provenance
          pub=$?
          set -e
          if [ "$pub" -eq 0 ]; then
            exit 0
          fi
          if npm view "${name}@${tag}" version >/dev/null 2>&1; then
            echo "publish raced; ${name}@${tag} is now on npm — treating as success"
            exit 0
          fi
          exit "$pub"

  gh-pkg:
    name: GitHub Packages
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: "@lovrozagar"
          package-manager-cache: false
      - name: Publish to GitHub Packages
        working-directory: ${{ env.PACKAGE_DIR }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ref="${{ inputs.tag || github.ref_name }}"
          tag="${ref#v}"
          name="${{ env.PACKAGE_NAME }}"
          if npm view "${name}@${tag}" --registry https://npm.pkg.github.com version >/dev/null 2>&1; then
            echo "GitHub Packages already has ${name}@${tag} — skipping"
            exit 0
          fi
          set +e
          npm publish --access public
          pub=$?
          set -e
          if [ "$pub" -eq 0 ]; then
            exit 0
          fi
          if npm view "${name}@${tag}" --registry https://npm.pkg.github.com version >/dev/null 2>&1; then
            echo "publish raced; ${name}@${tag} is now on GitHub Packages — treating as success"
            exit 0
          fi
          exit "$pub"

  github-release:
    name: GitHub Release
    needs: [npmjs, gh-pkg]
    if: ${{ !cancelled() && needs.gh-pkg.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub release $tag already exists"
          else
            gh release create "$tag" --generate-notes --title "${tag#v}"
          fi
