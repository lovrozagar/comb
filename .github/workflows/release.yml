name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.1.1). Empty = this ref."
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Every job inherits this; the publishing jobs ask for id-token, packages and contents: write themselves.
permissions:
  contents: read

env:
  PACKAGE_NAME: "@lovrozagar/comb"
  PACKAGE_DIR: packages/core

jobs:
  # CI is the full gate: this job reruns no test. It waits for ci.yml's push run on main at the tagged commit and passes
  # on its success (.github/scripts/release-ci-gate.sh), after checking the tag against the package's version there.
  ci:
    name: ci
    runs-on: ubuntu-latest
    # a run still going at the tag waits here; ci.yml's longest path is 30 minutes (consumers, or a 20-minute test shard
    # then the 10-minute coverage merge), so 60 covers one that started late
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          # the gate and ci-wait, which it runs; package.json pins the bun version
          sparse-checkout: |
            /.github/scripts/
            /scripts/ci-wait.ts
            /package.json
          sparse-checkout-cone-mode: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Wait for main's ci.yml run on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          # a dispatch on an older tag resolves its commit through the API; a tag push is at github.sha
          SHA: ${{ !inputs.tag && github.sha || '' }}
          GRACE_SECONDS: "600"
        run: .github/scripts/release-ci-gate.sh

  npmjs:
    name: npmjs.com
    needs: [ci]
    runs-on: ubuntu-latest
    # the tarball wait alone may take 15 minutes (.github/scripts/npm-tarball-wait.sh)
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # the package is published as bun packs it, every catalog: version resolved
      - run: bun install --frozen-lockfile
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install -g npm@latest
      - name: Publish to registry.npmjs.org
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          set -euo pipefail
          ref="${{ inputs.tag || github.ref_name }}"
          tag="${ref#v}"
          name="${{ env.PACKAGE_NAME }}"
          encoded="$(node -p 'encodeURIComponent(process.argv[1])' "$name")"

          # Metadata can exist without a downloadable tarball (broken publish).
          # Only skip when the tarball itself is fetchable.
          if curl -fsSIL "https://registry.npmjs.org/${name}/-/${name##*/}-${tag}.tgz" >/dev/null 2>&1; then
            echo "npm tarball for ${name}@${tag} already exists — skipping"
            exit 0
          fi
          if npm view "${name}@${tag}" version >/dev/null 2>&1; then
            # an earlier run published it; its tarball may still be on its way through the CDN
            echo "npm has ${name}@${tag} metadata; waiting for its tarball instead of re-publishing"
            exec "${GITHUB_WORKSPACE}/.github/scripts/npm-tarball-wait.sh" "$name" "$tag"
          fi

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "OIDC request URL/token missing — id-token: write is not in effect"
            exit 1
          fi
          audience="$(node -p 'encodeURIComponent("npm:registry.npmjs.org")')"
          curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience}" \
            -o /tmp/oidc.json
          node -e 'const j=require("/tmp/oidc.json"); if(!j.value) process.exit(2)'
          node -e '
            const t = require("/tmp/oidc.json").value
            const p = JSON.parse(Buffer.from(t.split(".")[1], "base64url").toString())
            console.log(JSON.stringify({
              iss: p.iss,
              aud: p.aud,
              sub: p.sub,
              workflow: p.workflow,
              job_workflow_ref: p.job_workflow_ref,
              repository: p.repository,
              ref: p.ref,
              environment: p.environment ?? null,
            }))
          '

          oidc_jwt="$(node -e 'process.stdout.write(require("/tmp/oidc.json").value)')"
          code=$(curl -sS -o /tmp/npm-ex.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${oidc_jwt}" \
            -H "Content-Type: application/json" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${encoded}")
          echo "oidc exchange HTTP $code"
          node -e 'const j=require("/tmp/npm-ex.json"); console.log(JSON.stringify({error:j.error,message:j.message,token_type:j.token_type,expires:j.expires}))'
          if [ "$code" != "201" ]; then
            echo "npm rejected the GitHub OIDC token."
            echo "On https://www.npmjs.com/package/${name} → Settings → Trusted Publisher"
            echo "the saved connection must be exactly:"
            echo "  GitHub Actions / lovrozagar / comb / release.yml / environment empty / allow npm publish"
            exit 1
          fi
          NODE_AUTH_TOKEN="$(node -e 'process.stdout.write(require("/tmp/npm-ex.json").token || "")')"
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "exchange succeeded but returned no token"
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "${HOME}/.npmrc"
          # bun pm pack ran the package's prepack; npm must not rerun it in the packed directory
          packed="$("${GITHUB_WORKSPACE}/.github/scripts/pack-for-publish.sh" .)"
          set +e
          npm publish "$packed" --access public --provenance --ignore-scripts
          pub=$?
          set -e
          if [ "$pub" -ne 0 ]; then
            if npm view "${name}@${tag}" version >/dev/null 2>&1; then
              echo "publish raced; ${name}@${tag} is now on npm — continuing to tarball check"
            else
              exit "$pub"
            fi
          fi

          # Metadata can land minutes before the tarball is downloadable.
          "${GITHUB_WORKSPACE}/.github/scripts/npm-tarball-wait.sh" "$name" "$tag"

  gh-pkg:
    name: GitHub Packages
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: "@lovrozagar"
          package-manager-cache: false
      # the npm the npmjs job publishes with, so both registries get one manifest
      - run: npm install -g npm@latest
      - name: Publish to GitHub Packages
        working-directory: ${{ env.PACKAGE_DIR }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ref="${{ inputs.tag || github.ref_name }}"
          tag="${ref#v}"
          name="${{ env.PACKAGE_NAME }}"
          if npm view "${name}@${tag}" --registry https://npm.pkg.github.com version >/dev/null 2>&1; then
            echo "GitHub Packages already has ${name}@${tag} — skipping"
            exit 0
          fi
          # bun pm pack ran the package's prepack; npm must not rerun it in the packed directory
          packed="$("${GITHUB_WORKSPACE}/.github/scripts/pack-for-publish.sh" .)"
          set +e
          npm publish "$packed" --access public --ignore-scripts
          pub=$?
          set -e
          if [ "$pub" -eq 0 ]; then
            exit 0
          fi
          if npm view "${name}@${tag}" --registry https://npm.pkg.github.com version >/dev/null 2>&1; then
            echo "publish raced; ${name}@${tag} is now on GitHub Packages — treating as success"
            exit 0
          fi
          exit "$pub"

  github-release:
    name: GitHub Release
    needs: [npmjs, gh-pkg]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub release $tag already exists"
          else
            gh release create "$tag" --generate-notes --title "${tag#v}"
          fi
