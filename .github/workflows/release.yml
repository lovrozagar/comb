name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.1.1). Empty = this ref."
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Every job inherits this; the publishing jobs ask for id-token, packages and contents: write themselves.
permissions:
  contents: read

env:
  PACKAGE_NAME: "@lovrozagar/comb"
  PACKAGE_DIR: packages/core

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    # test:coverage ran 14m40s in ci run 41333028493 (8m36s in release run 41293589626), with the
    # checks before it under a minute; 23 minutes is about 1.5x the slowest; test:bun has its own job below
    timeout-minutes: 23
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: comb
          POSTGRES_PASSWORD: comb
          POSTGRES_USER: comb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U comb -d comb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # The Postgres suites are required here; tests/integration/support/pg.ts fails the run when it is unset.
      COMB_TEST_PG_URL: postgres://comb:comb@localhost:5432/comb?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # vitest runs on Node; Miniflare's workerd and the pg drivers are exercised there
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun run fmt:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run typecheck:strict
      # The Atlas suites are required here; tests/integration/support/atlas.ts fails the run without it.
      - name: install atlas v1.3.0
        run: |
          mkdir -p "$RUNNER_TEMP/atlas"
          curl -sSfL -o "$RUNNER_TEMP/atlas/atlas" https://release.ariga.io/atlas/atlas-linux-amd64-v1.3.0
          echo "cfc773e5b4e845bc01d680390c174648938a7f88bf30e5a2c83ae85217c21587  $RUNNER_TEMP/atlas/atlas" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/atlas/atlas"
          echo "$RUNNER_TEMP/atlas" >> "$GITHUB_PATH"
      - run: bun run test:coverage

  test-bun:
    name: test (bun)
    runs-on: ubuntu-latest
    # test:bun ran 3-6s in runs 41293589626 and 41333028493, after ~20s of setup; the Postgres
    # service's health check may take up to 60s (12 retries, 5s apart), so 5 minutes still catches a hang
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: comb
          POSTGRES_PASSWORD: comb
          POSTGRES_USER: comb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U comb -d comb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # The Postgres suites are required here; tests/integration/support/pg.ts fails the run when it is unset.
      COMB_TEST_PG_URL: postgres://comb:comb@localhost:5432/comb?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # The Atlas suites are required here; tests/integration/support/atlas.ts fails the run without it.
      - name: install atlas v1.3.0
        run: |
          mkdir -p "$RUNNER_TEMP/atlas"
          curl -sSfL -o "$RUNNER_TEMP/atlas/atlas" https://release.ariga.io/atlas/atlas-linux-amd64-v1.3.0
          echo "cfc773e5b4e845bc01d680390c174648938a7f88bf30e5a2c83ae85217c21587  $RUNNER_TEMP/atlas/atlas" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/atlas/atlas"
          echo "$RUNNER_TEMP/atlas" >> "$GITHUB_PATH"
      - run: bun run test:bun

  npmjs:
    name: npmjs.com
    needs: [test, test-bun]
    runs-on: ubuntu-latest
    # the tarball wait alone may take 15 minutes (.github/scripts/npm-tarball-wait.sh)
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # the package is published as bun packs it, every catalog: version resolved
      - run: bun install --frozen-lockfile
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install -g npm@latest
      - name: Check tag matches package.json
        run: |
          ref="${{ inputs.tag || github.ref_name }}"
          tag="${ref#v}"
          pkg="$(node -p "require('./${{ env.PACKAGE_DIR }}/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match ${{ env.PACKAGE_DIR }}/package.json version $pkg"
            exit 1
          fi
      - name: Publish to registry.npmjs.org
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          set -euo pipefail
          ref="${{ inputs.tag || github.ref_name }}"
          tag="${ref#v}"
          name="${{ env.PACKAGE_NAME }}"
          encoded="$(node -p 'encodeURIComponent(process.argv[1])' "$name")"

          # Metadata can exist without a downloadable tarball (broken publish).
          # Only skip when the tarball itself is fetchable.
          if curl -fsSIL "https://registry.npmjs.org/${name}/-/${name##*/}-${tag}.tgz" >/dev/null 2>&1; then
            echo "npm tarball for ${name}@${tag} already exists — skipping"
            exit 0
          fi
          if npm view "${name}@${tag}" version >/dev/null 2>&1; then
            # an earlier run published it; its tarball may still be on its way through the CDN
            echo "npm has ${name}@${tag} metadata; waiting for its tarball instead of re-publishing"
            exec "${GITHUB_WORKSPACE}/.github/scripts/npm-tarball-wait.sh" "$name" "$tag"
          fi

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "OIDC request URL/token missing — id-token: write is not in effect"
            exit 1
          fi
          audience="$(node -p 'encodeURIComponent("npm:registry.npmjs.org")')"
          curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience}" \
            -o /tmp/oidc.json
          node -e 'const j=require("/tmp/oidc.json"); if(!j.value) process.exit(2)'
          node -e '
            const t = require("/tmp/oidc.json").value
            const p = JSON.parse(Buffer.from(t.split(".")[1], "base64url").toString())
            console.log(JSON.stringify({
              iss: p.iss,
              aud: p.aud,
              sub: p.sub,
              workflow: p.workflow,
              job_workflow_ref: p.job_workflow_ref,
              repository: p.repository,
              ref: p.ref,
              environment: p.environment ?? null,
            }))
          '

          oidc_jwt="$(node -e 'process.stdout.write(require("/tmp/oidc.json").value)')"
          code=$(curl -sS -o /tmp/npm-ex.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${oidc_jwt}" \
            -H "Content-Type: application/json" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${encoded}")
          echo "oidc exchange HTTP $code"
          node -e 'const j=require("/tmp/npm-ex.json"); console.log(JSON.stringify({error:j.error,message:j.message,token_type:j.token_type,expires:j.expires}))'
          if [ "$code" != "201" ]; then
            echo "npm rejected the GitHub OIDC token."
            echo "On https://www.npmjs.com/package/${name} → Settings → Trusted Publisher"
            echo "the saved connection must be exactly:"
            echo "  GitHub Actions / lovrozagar / comb / release.yml / environment empty / allow npm publish"
            exit 1
          fi
          NODE_AUTH_TOKEN="$(node -e 'process.stdout.write(require("/tmp/npm-ex.json").token || "")')"
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "exchange succeeded but returned no token"
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "${HOME}/.npmrc"
          # bun pm pack ran the package's prepack; npm must not rerun it in the packed directory
          packed="$("${GITHUB_WORKSPACE}/.github/scripts/pack-for-publish.sh" .)"
          set +e
          npm publish "$packed" --access public --provenance --ignore-scripts
          pub=$?
          set -e
          if [ "$pub" -ne 0 ]; then
            if npm view "${name}@${tag}" version >/dev/null 2>&1; then
              echo "publish raced; ${name}@${tag} is now on npm — continuing to tarball check"
            else
              exit "$pub"
            fi
          fi

          # Metadata can land minutes before the tarball is downloadable.
          "${GITHUB_WORKSPACE}/.github/scripts/npm-tarball-wait.sh" "$name" "$tag"

  gh-pkg:
    name: GitHub Packages
    needs: [test, test-bun]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: "@lovrozagar"
          package-manager-cache: false
      # the npm the npmjs job publishes with, so both registries get one manifest
      - run: npm install -g npm@latest
      - name: Publish to GitHub Packages
        working-directory: ${{ env.PACKAGE_DIR }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ref="${{ inputs.tag || github.ref_name }}"
          tag="${ref#v}"
          name="${{ env.PACKAGE_NAME }}"
          if npm view "${name}@${tag}" --registry https://npm.pkg.github.com version >/dev/null 2>&1; then
            echo "GitHub Packages already has ${name}@${tag} — skipping"
            exit 0
          fi
          # bun pm pack ran the package's prepack; npm must not rerun it in the packed directory
          packed="$("${GITHUB_WORKSPACE}/.github/scripts/pack-for-publish.sh" .)"
          set +e
          npm publish "$packed" --access public --ignore-scripts
          pub=$?
          set -e
          if [ "$pub" -eq 0 ]; then
            exit 0
          fi
          if npm view "${name}@${tag}" --registry https://npm.pkg.github.com version >/dev/null 2>&1; then
            echo "publish raced; ${name}@${tag} is now on GitHub Packages — treating as success"
            exit 0
          fi
          exit "$pub"

  github-release:
    name: GitHub Release
    needs: [npmjs, gh-pkg]
    if: ${{ !cancelled() && needs.gh-pkg.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub release $tag already exists"
          else
            gh release create "$tag" --generate-notes --title "${tag#v}"
          fi
